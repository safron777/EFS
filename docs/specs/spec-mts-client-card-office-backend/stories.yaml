- id: "7"
  title: CAP-7 — Risk blocks
  description: >-
    Статус блокировок карты по трём источникам: СФМ, арест ФССП, антифрод.
    Смотри SPEC.md CAP-7.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Этот сервис фасадит три stub-порта (SfmPort/FsspPort/AntifraudPort, AD-10) —
    у него больше всего путей отказа среди всех 9 сервисов. Перед реализацией
    нужно закрыть открытый вопрос 1 из SPEC.md: словарь значений error.code
    (например NOT_FOUND, VALIDATION_ERROR, UPSTREAM_UNAVAILABLE — последнее
    особенно важно здесь, если один из трёх stub-портов "недоступен"). Реши это
    на этапе спеки данной истории, до кода.

