- id: "10"
  title: CAP-10 — Incident-case: массовые инциденты
  description: >-
    Приём массовых инцидентов из системы мониторинга через Kafka-события,
    привязка клиента к инциденту. Смотри SPEC.md CAP-10.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Самая рискованная интеграция во всей спеке — событие Kafka должно реально
    дойти до экрана инцидентов без REST-опроса (AD-5). Перед реализацией нужно
    закрыть открытый вопрос 2 из SPEC.md: точные поля внутри data для
    MassIncidentOpened/Updated/Closed (вероятно зеркалят mockData.massIncidents
    — theme, product, start, status, affected, matchesClient — но это не
    подтверждено как контракт на проводе). Топик/конверт — уже зафиксированы
    в AD-11, обсуждению не подлежат, только поля data. done_checkpoint стоит
    осознанно: хочу убедиться, что событие реально доходит до фронтенда, прежде
    чем двигаться дальше.

