- id: "0"
  title: Инфраструктурный каркас — монорепо, Gateway, docker-compose, Kafka
  description: >-
    Maven multi-module скелет на все 9 сервисов + gateway-модуль; docker-compose,
    поднимающий Gateway, 9 инстансов PostgreSQL и Kafka. Без бизнес-логики —
    только то, что нужно, чтобы остальные истории было куда класть.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Смотри ARCHITECTURE-SPINE.md: AD-1 (9 сервисов, у каждого своя БД, никаких
    общих схем), AD-6 (Gateway — единственная точка входа для фронтенда, сервисы
    не публикуют порты наружу в docker-compose), и таблицу Stack (Java 25 LTS,
    Spring Boot 4.1.1, PostgreSQL 18.6, Kafka 4.3.1, Maven 3.9.16, Testcontainers
    2.0.5). Структура репозитория — как в разделе Structural Seed спайна.

- id: "1"
  title: CAP-1 — Client identity
  description: >-
    Эндпоинт профиля клиента: badges, triggers, открытые обращения. Смотри
    SPEC.md CAP-1.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    REST-форма — AD-8 (мирроринг client.js: /clients/{id}). Поле link у каждого
    trigger обязано пройти правило AD-4 (только относительный внутренний путь,
    иначе null) — это унаследованная защита от open-redirect (GHSA-wrjc-x8rr-h8h6).

- id: "2"
  title: CAP-2 — Top offer
  description: >-
    Эндпоинт топ-предложения клиента через отдельный сервис offers. Смотри
    SPEC.md CAP-2.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Это девятый сервис, добавленный отдельно от client-identity (AD-1). Внешний
    offer-движок банка — за stub-портом OfferEnginePort (AD-10, тот же паттерн,
    что и risk-blocks). Ссылка на клиента — только по clientId (AD-2), не копия
    данных.

