    карты. Смотри SPEC.md CAP-3.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Деньги — целое число в копейках, никогда отформатированная строка (AD-3).
    Форматирование — забота фронтенда.

