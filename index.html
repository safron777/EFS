<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная карточка клиента — МТС Банк</title>
    <!--
      CSP-meta сюда НЕ хардкодим — его инжектит vite.config.js (плагин
      csp-meta-for-build, apply: "build") только в продакшен-сборку.
      Причина: Vite в dev-режиме подключает CSS через рантайм-инжект
      <style> (HMR), а не через <link> — строгий style-src 'self' это
      блокирует, и страница рендерится вообще без стилей (проверено
      скриншотом, не только структурой DOM — это и подвело в первый раз).
      В dist/index.html инлайновых <script>/<style> нет вообще (весь
      JS/CSS — внешние бандлы), поэтому в проде можно себе позволить CSP
      без единого unsafe-inline.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
