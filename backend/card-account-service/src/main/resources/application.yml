server:
  port: 8080

spring:
  application:
    name: card-account-service
  datasource:
    url: jdbc:postgresql://card-account-service-postgres:5432/card_account
    username: card_account
    password: card_account
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
