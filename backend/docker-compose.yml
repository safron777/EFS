  # ---- Kafka (KRaft mode, no ZooKeeper -- Kafka 4.x removed it) ----
  # Shared infra stood up here even though incident-case-service is the only
  # consumer in this story's scope; every future story that touches events
  # depends on it existing (see story Design Notes).
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Under /home/appuser rather than /tmp: the image already creates and
      # owns /home/appuser for the non-root user it runs as, so a fresh named
      # volume mounted exactly there inherits that ownership (Docker copies a
      # new volume's initial permissions from the image's existing directory
      # at the mount path). Mounting under /tmp instead gets a volume owned by
      # root with no such directory to copy from, which the broker then can't
      # write to.
      KAFKA_LOG_DIRS: '/home/appuser/kraft-combined-logs'
    volumes:
      - kafka-data:/home/appuser
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cardoffice-net

networks:
  cardoffice-net:
    driver: bridge

volumes:
  client-identity-service-pgdata:
  offers-service-pgdata:
  card-account-service-pgdata:
  card-issuance-service-pgdata:
  operations-service-pgdata:
  risk-blocks-service-pgdata:
  cashback-service-pgdata:
  notifications-service-pgdata:
  incident-case-service-pgdata:
  kafka-data:
