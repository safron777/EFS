# mts-client-card-office backend -- local development stack.
#
# AD-6: gateway is the only service that publishes a host port; the 9
# bounded-context services, their Postgres instances and Kafka are reachable
# only on this compose file's own network.
#
# Bring the stack up: docker compose -f backend/docker-compose.yml up -d --wait
# See backend/README.md for the full walkthrough (build gate, health checks,
# host-JDK vs. build-JDK note).

name: mts-client-card-office-backend

services:
  # ---- API Gateway (AD-6): single frontend entry point, only published port ----
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      client-identity-service:
        condition: service_healthy
      offers-service:
        condition: service_healthy
      card-account-service:
        condition: service_healthy
      card-issuance-service:
        condition: service_healthy
      operations-service:
        condition: service_healthy
      risk-blocks-service:
        condition: service_healthy
      cashback-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      incident-case-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - cardoffice-net

  # ---- client-identity-service ----
  client-identity-service:
    build:
      context: .
      dockerfile: client-identity-service/Dockerfile
    depends_on:
      client-identity-service-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - cardoffice-net

  client-identity-service-postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: client_identity
      POSTGRES_USER: client_identity
      POSTGRES_PASSWORD: client_identity
    volumes:
      - client-identity-service-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U client_identity -d client_identity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cardoffice-net

  # ---- offers-service ----
